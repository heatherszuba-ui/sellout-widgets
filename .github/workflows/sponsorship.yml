name: Refresh sponsorship total

on:
  schedule:
    # Hourly at :40 UTC. Donations sync from RunSignup daily; signed deals
    # change whenever someone edits the Lead Tracker.
    - cron: "40 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch-sponsorship.mjs"
      - "src/sponsorship-model.js"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  sponsorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add up sponsorship and donations from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/fetch-sponsorship.mjs

      - name: Commit updated data
        run: |
          git config user.name "sellout-widgets bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sponsorship.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh sponsorship total $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
